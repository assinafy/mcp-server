name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate MCP Registry manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install jsonschema
      - name: Validate the published schema and release version
        env:
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          python - <<'PYTHON'
          import json, os, urllib.request
          from jsonschema import validate
          with open('server.json') as source:
              manifest = json.load(source)
          with urllib.request.urlopen(manifest['$schema'], timeout=30) as response:
              validate(manifest, json.load(response))
          assert manifest['name'] == 'io.github.assinafy/mcp-server'
          if os.environ['TAG_NAME']:
              assert os.environ['TAG_NAME'] == 'v' + manifest['version']
          PYTHON
